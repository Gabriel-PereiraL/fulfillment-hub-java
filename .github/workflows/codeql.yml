name: codeql
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 4 * * 1"
permissions: { contents: read }
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - uses: github/codeql-action/init@7999b86c43a865dc79d8923397f35af22de63401
        with: { languages: java-kotlin, build-mode: manual }
      - name: Build
        run: mvn -B -ntp -DskipTests package
      - uses: github/codeql-action/analyze@7999b86c43a865dc79d8923397f35af22de63401
        with:
          upload: false
          output: codeql-results
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codeql-sarif
          path: codeql-results
          retention-days: 14
