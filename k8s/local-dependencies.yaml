apiVersion: apps/v1
kind: Deployment
metadata: { name: postgres, namespace: fulfillment-hub }
spec:
  replicas: 1
  selector: { matchLabels: { app: fulfillment-postgres } }
  template:
    metadata: { labels: { app: fulfillment-postgres } }
    spec:
      containers:
        - name: postgres
          image: postgres:17.6-alpine@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
          env:
            - { name: POSTGRES_DB, value: fulfillment }
            - { name: POSTGRES_USER, value: fulfillment }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: fulfillment-secrets, key: DATABASE_PASSWORD } }
          ports: [{ containerPort: 5432 }]
          readinessProbe: { exec: { command: [sh, -c, "pg_isready -U fulfillment -d fulfillment"] }, initialDelaySeconds: 5 }
---
apiVersion: v1
kind: Service
metadata: { name: postgres, namespace: fulfillment-hub }
spec: { selector: { app: fulfillment-postgres }, ports: [{ port: 5432, targetPort: 5432 }] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: localstack, namespace: fulfillment-hub }
spec:
  replicas: 1
  selector: { matchLabels: { app: fulfillment-localstack } }
  template:
    metadata: { labels: { app: fulfillment-localstack } }
    spec:
      containers:
        - name: localstack
          image: localstack/localstack:4.8.1@sha256:8c9756bddc44625cd6e890f5e4bcc29b045eebe108b268482b848f4f832ec153
          env: [{ name: SERVICES, value: sqs }, { name: EAGER_SERVICE_LOADING, value: "1" }]
          ports: [{ containerPort: 4566 }]
          readinessProbe: { httpGet: { path: /_localstack/health, port: 4566 }, initialDelaySeconds: 10 }
---
apiVersion: v1
kind: Service
metadata: { name: localstack, namespace: fulfillment-hub }
spec: { selector: { app: fulfillment-localstack }, ports: [{ port: 4566, targetPort: 4566 }] }
