spring:
  main:
    web-application-type: none
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}
  flyway:
    enabled: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
fulfillment:
  security:
    signing-key: ${JWT_SIGNING_KEY:local-worker-signing-key-at-least-thirty-two-bytes}
    issuer: fulfillmenthub
    audience: fulfillmenthub-api
    access-minutes: 15
    session-days: 7
  webhooks:
    payment-key: ${PAYMENT_WEBHOOK_KEY:local-payment-webhook-key}
    delivery-key: ${DELIVERY_WEBHOOK_KEY:local-delivery-webhook-key}
    tolerance-seconds: 300
  outbox:
    poll-ms: 500
  messaging:
    enabled: ${MESSAGING_ENABLED:false}
    provision: ${SQS_PROVISION:true}
    endpoint: ${SQS_ENDPOINT:}
    region: ${AWS_REGION:us-east-1}
    domain-queue: fh-domain-events
    domain-dlq: fh-domain-events-dlq
    webhook-queue: fh-webhooks-inbound
    webhook-dlq: fh-webhooks-inbound-dlq
    poll-ms: 1000
  providers:
    payment:
      enabled: ${PAYMENT_PROVIDER_ENABLED:false}
      base-url: ${PAYMENT_PROVIDER_URL:http://localhost:8082}
      token: ${PAYMENT_PROVIDER_TOKEN:local-payment-token}
    delivery:
      enabled: ${DELIVERY_PROVIDER_ENABLED:false}
      base-url: ${DELIVERY_PROVIDER_URL:http://localhost:8082}
      customer-id: ${DELIVERY_PROVIDER_CUSTOMER_ID:local-customer}
      client-id: ${DELIVERY_PROVIDER_CLIENT_ID:local-client}
      client-secret: ${DELIVERY_PROVIDER_CLIENT_SECRET:local-secret}
logging:
  structured:
    format.console: ecs
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
